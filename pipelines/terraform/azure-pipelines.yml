trigger:
  branches:
    include:
      - main

variables:
  terraformWorkingDirectory: 'IaC/environments/dev'
  terraformVersion: '1.13.1'

  # Terraform remote backend
  backendResourceGroup: 'rg-terraform-state'
  backendStorageAccount: 'stazclouddevopstfstate'
  backendContainer: 'tfstate'
  backendKey: 'dev.terraform.tfstate'

  # Azure DevOps ARM service connection
  azureServiceConnection: 'sc-azure-cloud-devops'

stages:
- stage: Validate
  displayName: 'Terraform Validate Stage'
 
  jobs:
  - job: TerraformValidate
    displayName: 'Terraform Validate Job'
    pool:
      vmImage: 'ubuntu-24.04'
 
    steps:
      - checkout: self
    
      - template: ../templates/install-terraform.yml
        parameters:
          terraformVersion: $(terraformVersion)

      - script: |
          echo "Azure Cloud DevOps - Terraform Pipeline"
          echo "Repository: $(Build.Repository.Name)"
          echo "Branch: $(Build.SourceBranchName)"
          terraform version
        displayName: 'Verify Terraform'

      - script: |
          terraform init -backend=false
        workingDirectory: '$(terraformWorkingDirectory)'
        displayName: 'Terraform Init'

      - script: |
          terraform fmt -check -recursive ../../
        workingDirectory: '$(terraformWorkingDirectory)'
        displayName: 'Terraform Format Check'

      - script: |
          terraform validate
        workingDirectory: '$(terraformWorkingDirectory)'
        displayName: 'Terraform Validate'

# =========================================================
# STAGE 2 - PLAN
# =========================================================
- stage: Plan
  displayName: 'Terraform Plan Stage'
  dependsOn: Validate
  condition: succeeded()

  jobs:
  - job: TerraformPlan
    displayName: 'Terraform Plan Job'

    pool:
      vmImage: 'ubuntu-24.04'

    steps:
      - checkout: self

      - template: ../templates/install-terraform.yml
        parameters:
          terraformVersion: $(terraformVersion)
      - task: AzureCLI@2
        displayName: 'Terraform Init and Plan'
        inputs:
          azureSubscription: '$(azureServiceConnection)'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          workingDirectory: '$(terraformWorkingDirectory)'
          inlineScript: |
            echo "Initializing Terraform remote backend"

            terraform init -reconfigure \
            -backend-config="resource_group_name=$(backendResourceGroup)" \
            -backend-config="storage_account_name=$(backendStorageAccount)" \
            -backend-config="container_name=$(backendContainer)" \
            -backend-config="key=$(backendKey)" \
            -backend-config="use_azuread_auth=true"

            echo "Running Terraform Plan"

            terraform plan -out=tfplan
          