trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-24.04'

variables:
  terraformWorkingDirectory: 'IaC/environments/dev'
  terraformVersion: '1.13.1'

steps:
  - checkout: self

  - script: |
      echo "Installing Terraform $(terraformVersion)"

      curl -fsSL \
        https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip \
        -o terraform.zip

      unzip terraform.zip
      sudo mv terraform /usr/local/bin/terraform
    displayName: 'Install Terraform'

  - script: |
      echo "Azure Cloud DevOps - Terraform Pipeline"
      echo "Repository: $(Build.Repository.Name)"
      echo "Branch: $(Build.SourceBranchName)"
      terraform version
    displayName: 'Verify Terraform'

  - script: |
      terraform init -backend=false
    workingDirectory: '$(terraformWorkingDirectory)'
    displayName: 'Terraform Init'

  - script: |
      terraform fmt -check -recursive ../../
    workingDirectory: '$(terraformWorkingDirectory)'
    displayName: 'Terraform Format Check'

  - script: |
      terraform validate
    workingDirectory: '$(terraformWorkingDirectory)'
    displayName: 'Terraform Validate'